name: CI/CD Pipeline

# Trigger: Run on every push to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: RUN TESTS ---
  test-code:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.19'

    - name: Run Tests
      run: go test -v ./...

  # --- JOB 2: BUILD & PUSH DOCKER ---
  build-and-push:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    
    # CRITICAL: This job waits for 'test-code' to finish successfully
    needs: test-code 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true

          tags: ${{ secrets.DOCKER_USERNAME }}/go-cicd-lab:latest